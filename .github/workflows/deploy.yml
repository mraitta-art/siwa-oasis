name: Validate application (Vercel deploys via Git integration)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 15

      - name: Lint public minisite API
        run: npx eslint 'src/app/api/public/minisite/[slug]/route.ts'
